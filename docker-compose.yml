services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/tx-reconciler
      - TIMESTAMP_TOLERANCE_SECONDS=300
      - QUANTITY_TOLERANCE_PCT=0.01
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    command: ["--quiet"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
